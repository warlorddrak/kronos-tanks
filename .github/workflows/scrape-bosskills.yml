name: Scrape Bosskills & Tanks

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Check for new bosskills and tank records
        run: bun run update-bosskills.ts

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bosskills.json
          if git diff --staged --quiet; then
            echo "No new bosskills to commit."
          else
            git commit -m "Update bosskills and tank records [skip ci]"
            git push
          fi
